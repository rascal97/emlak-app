{% extends "base.html" %}
{% block title %}{{ baslik }}{% endblock %}
{% block page_title %}{{ baslik }}{% endblock %}

{% block header_left %}
  <a href="{{ url_for('randevular') }}" class="tb-btn"><i class="bi bi-arrow-left"></i></a>
{% endblock %}

{% block content %}
<form method="post" class="page-content">

  <div class="form-group">
    <label class="form-label">Müşteri</label>
    <select name="musteri_id" class="form-select">
      <option value="">— Müşteri seçin —</option>
      {% for m in musteriler %}
      <option value="{{ m.id }}"
        {% if randevu and randevu.musteri_id == m.id %}selected
        {% elif pre_musteri_id and pre_musteri_id | int == m.id %}selected{% endif %}>
        {{ m.ad }} {{ m.soyad }}{% if m.telefon %} · {{ m.telefon }}{% endif %}
      </option>
      {% endfor %}
    </select>
  </div>

  <div class="form-group">
    <label class="form-label">İlan</label>
    <select name="ilan_id" class="form-select">
      <option value="">— İlan seçin (isteğe bağlı) —</option>
      {% for i in ilan_listesi %}
      <option value="{{ i.id }}"
        {% if randevu and randevu.ilan_id == i.id %}selected
        {% elif pre_ilan_id and pre_ilan_id | int == i.id %}selected{% endif %}>
        {{ i.baslik }}{% if i.sehir %} ({{ i.sehir }}){% endif %}
      </option>
      {% endfor %}
    </select>
  </div>

  <div class="row g-2 mb-3">
    <div class="col-7">
      <label class="form-label">Tarih <span class="text-danger">*</span></label>
      <input type="date" name="tarih" class="form-control"
             value="{{ randevu.tarih if randevu else '' }}" required>
    </div>
    <div class="col-5">
      <label class="form-label">Saat</label>
      <input type="time" name="saat" class="form-control"
             value="{{ randevu.saat if randevu and randevu.saat else '' }}">
    </div>
  </div>

  <div class="form-group">
    <label class="form-label">Konu</label>
    <input type="text" name="konu" class="form-control"
           value="{{ randevu.konu if randevu else '' }}"
           placeholder="Ev gezisi, tapu görüşmesi…">
  </div>

  <div class="form-group">
    <label class="form-label">Durum</label>
    <select name="durum" class="form-select">
      <option value="planlandı"  {% if not randevu or randevu.durum == 'planlandı'  %}selected{% endif %}>Planlandı</option>
      <option value="tamamlandı" {% if randevu and randevu.durum == 'tamamlandı'   %}selected{% endif %}>Tamamlandı</option>
      <option value="iptal"      {% if randevu and randevu.durum == 'iptal'         %}selected{% endif %}>İptal</option>
    </select>
  </div>

  <div class="form-group">
    <label class="form-label">Notlar</label>
    <textarea name="notlar" class="form-control"
              placeholder="Randevu notları…">{{ randevu.notlar if randevu else '' }}</textarea>
  </div>

  <button type="submit" class="btn btn-primary btn-full mt-2">
    <i class="bi bi-check-lg me-1"></i>{{ 'Güncelle' if randevu else 'Kaydet' }}
  </button>
  <a href="{{ url_for('randevular') }}" class="btn btn-outline-secondary btn-full mt-2">İptal</a>

</form>
{% endblock %}
