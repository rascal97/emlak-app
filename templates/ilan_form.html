{% extends "base.html" %}
{% block title %}{{ baslik }}{% endblock %}
{% block page_title %}{{ baslik }}{% endblock %}

{% block header_left %}
  <a href="{{ url_for('ilanlar') }}" class="tb-btn"><i class="bi bi-arrow-left"></i></a>
{% endblock %}

{% block content %}
<form method="post" class="page-content">

  <div class="form-group">
    <label class="form-label">Başlık <span class="text-danger">*</span></label>
    <input type="text" name="baslik" class="form-control"
           value="{{ ilan.baslik if ilan else '' }}"
           placeholder="Kadıköy 3+1 Satılık Daire" required autofocus>
  </div>

  <div class="row g-2 mb-3">
    <div class="col-6">
      <label class="form-label">Tip</label>
      <select name="tip" class="form-select">
        <option value="satilik" {% if not ilan or ilan.tip == 'satilik' %}selected{% endif %}>Satılık</option>
        <option value="kiralik" {% if ilan and ilan.tip == 'kiralik' %}selected{% endif %}>Kiralık</option>
      </select>
    </div>
    <div class="col-6">
      <label class="form-label">Kategori</label>
      <select name="kategori" class="form-select">
        {% for c, l in [('daire','Daire'),('villa','Villa'),('arsa','Arsa'),('is_yeri','İş Yeri'),('dukkan','Dükkan'),('depo','Depo')] %}
        <option value="{{ c }}" {% if ilan and ilan.kategori == c %}selected{% elif not ilan and c == 'daire' %}selected{% endif %}>{{ l }}</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <div class="row g-2 mb-3">
    <div class="col-6">
      <label class="form-label">Şehir</label>
      <input type="text" name="sehir" class="form-control"
             value="{{ ilan.sehir if ilan else '' }}" placeholder="İstanbul">
    </div>
    <div class="col-6">
      <label class="form-label">İlçe</label>
      <input type="text" name="ilce" class="form-control"
             value="{{ ilan.ilce if ilan else '' }}" placeholder="Kadıköy">
    </div>
  </div>

  <div class="form-group">
    <label class="form-label">Adres</label>
    <input type="text" name="adres" class="form-control"
           value="{{ ilan.adres if ilan else '' }}" placeholder="Sokak, mahalle…">
  </div>

  <hr class="form-divider">
  <p class="form-section-title">Detaylar</p>

  <div class="form-group">
    <label class="form-label">Fiyat (₺)</label>
    <input type="number" name="fiyat" class="form-control"
           value="{{ ilan.fiyat if ilan and ilan.fiyat else '' }}"
           placeholder="1500000" min="0" step="1000">
  </div>

  <div class="row g-2 mb-3">
    <div class="col-6">
      <label class="form-label">Alan (m²)</label>
      <input type="number" name="metrekare" class="form-control"
             value="{{ ilan.metrekare if ilan and ilan.metrekare else '' }}"
             placeholder="120" min="0">
    </div>
    <div class="col-6">
      <label class="form-label">Oda Sayısı</label>
      <select name="oda_sayisi" class="form-select">
        <option value="">—</option>
        {% for o in ['Stüdyo','1+0','1+1','2+1','3+1','4+1','5+1','6+1'] %}
        <option value="{{ o }}" {% if ilan and ilan.oda_sayisi == o %}selected{% endif %}>{{ o }}</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <div class="form-group">
    <label class="form-label">Durum</label>
    <select name="durum" class="form-select">
      <option value="aktif"     {% if not ilan or ilan.durum == 'aktif'     %}selected{% endif %}>Aktif</option>
      <option value="satildi"   {% if ilan and ilan.durum == 'satildi'      %}selected{% endif %}>Satıldı</option>
      <option value="kiralandı" {% if ilan and ilan.durum == 'kiralandı'    %}selected{% endif %}>Kiralandı</option>
      <option value="pasif"     {% if ilan and ilan.durum == 'pasif'        %}selected{% endif %}>Pasif</option>
    </select>
  </div>

  <div class="form-group">
    <label class="form-label">Açıklama</label>
    <textarea name="aciklama" class="form-control"
              placeholder="İlan detayları, özellikler…">{{ ilan.aciklama if ilan else '' }}</textarea>
  </div>

  <button type="submit" class="btn btn-primary btn-full mt-2">
    <i class="bi bi-check-lg me-1"></i>{{ 'Güncelle' if ilan else 'Kaydet' }}
  </button>
  <a href="{{ url_for('ilanlar') }}" class="btn btn-outline-secondary btn-full mt-2">İptal</a>

</form>
{% endblock %}
