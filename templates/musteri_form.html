{% extends "base.html" %}
{% block title %}{{ baslik }}{% endblock %}
{% block page_title %}{{ baslik }}{% endblock %}

{% block header_left %}
  <a href="{{ url_for('musteriler') }}" class="tb-btn"><i class="bi bi-arrow-left"></i></a>
{% endblock %}

{% block content %}
<form method="post" class="page-content">

  <div class="form-group">
    <label class="form-label">Ad <span class="text-danger">*</span></label>
    <input type="text" name="ad" class="form-control"
           value="{{ musteri.ad if musteri else '' }}" required autofocus>
  </div>

  <div class="form-group">
    <label class="form-label">Soyad <span class="text-danger">*</span></label>
    <input type="text" name="soyad" class="form-control"
           value="{{ musteri.soyad if musteri else '' }}" required>
  </div>

  <div class="form-group">
    <label class="form-label">Telefon</label>
    <input type="tel" name="telefon" class="form-control"
           value="{{ musteri.telefon if musteri else '' }}" placeholder="05xx xxx xx xx">
  </div>

  <div class="form-group">
    <label class="form-label">E-posta</label>
    <input type="email" name="email" class="form-control"
           value="{{ musteri.email if musteri else '' }}" placeholder="ornek@mail.com">
  </div>

  <hr class="form-divider">
  <p class="form-section-title">Bütçe (₺)</p>

  <div class="row g-2 mb-3">
    <div class="col-6">
      <label class="form-label">Minimum</label>
      <input type="number" name="butce_min" class="form-control"
             value="{{ musteri.butce_min if musteri and musteri.butce_min else '' }}"
             placeholder="500000" min="0" step="1000">
    </div>
    <div class="col-6">
      <label class="form-label">Maksimum</label>
      <input type="number" name="butce_max" class="form-control"
             value="{{ musteri.butce_max if musteri and musteri.butce_max else '' }}"
             placeholder="3000000" min="0" step="1000">
    </div>
  </div>

  <hr class="form-divider">
  <p class="form-section-title">Tercihler & Notlar</p>

  <div class="form-group">
    <label class="form-label">İlgi Alanları</label>
    <textarea name="ilgi_alanlari" class="form-control"
              placeholder="Kadıköy, 2+1 daire, satılık…">{{ musteri.ilgi_alanlari if musteri else '' }}</textarea>
    <div class="form-text">Bölge, tip, özellik tercihleri</div>
  </div>

  <div class="form-group">
    <label class="form-label">Notlar</label>
    <textarea name="notlar" class="form-control"
              placeholder="Müşteri hakkında notlar…">{{ musteri.notlar if musteri else '' }}</textarea>
  </div>

  <button type="submit" class="btn btn-primary btn-full mt-2">
    <i class="bi bi-check-lg me-1"></i>
    {{ 'Güncelle' if musteri else 'Kaydet' }}
  </button>

  <a href="{{ url_for('musteriler') }}" class="btn btn-outline-secondary btn-full mt-2">İptal</a>

</form>
{% endblock %}
