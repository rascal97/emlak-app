<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Kayıt Ol — Emlak Pro</title>
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#1b3a5c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1b3a5c;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    }
    .card {
      background: white; border-radius: 20px; padding: 32px 24px;
      width: 100%; max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo .bi { font-size: 3rem; color: #1b3a5c; }
    .logo h1 { font-size: 1.4rem; font-weight: 700; color: #1b3a5c; margin: 8px 0 4px; }
    .logo p  { color: #6b7280; font-size: .88rem; }
    .form-label { font-size: .85rem; font-weight: 600; color: #374151; margin-bottom: 5px; }
    .form-control {
      font-size: 16px; border-radius: 10px; border: 1.5px solid #e5e7eb;
      padding: 12px 14px; min-height: 48px;
    }
    .form-control:focus { border-color: #1b3a5c; box-shadow: 0 0 0 3px rgba(27,58,92,.12); outline: none; }
    .form-group { margin-bottom: 16px; }
    .form-hint { font-size: .75rem; color: #9ca3af; margin-top: 4px; }
    .btn-submit {
      display: block; width: 100%; min-height: 48px;
      background: #1b3a5c; color: white; border: none;
      border-radius: 10px; font-size: 1rem; font-weight: 600;
      cursor: pointer; margin-top: 8px;
    }
    .btn-submit:active { background: #254e7d; }
    .footer-link { text-align: center; margin-top: 20px; font-size: .88rem; color: #6b7280; }
    .footer-link a { color: #1b3a5c; font-weight: 600; text-decoration: none; }
    .alert { border-radius: 10px; font-size: .88rem; padding: 10px 14px; margin-bottom: 16px; }
    .alert-danger  { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    .alert-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    .alert-warning { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <i class="bi bi-building"></i>
      <h1>Emlak Pro</h1>
      <p>Yeni hesap oluşturun</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}{% for cat, msg in messages %}
        <div class="alert alert-{{ cat }}">{{ msg }}</div>
      {% endfor %}{% endif %}
    {% endwith %}

    <form method="post">
      <div class="form-group">
        <label class="form-label">Kullanıcı Adı <span style="color:red;">*</span></label>
        <input type="text" name="kullanici_adi" class="form-control"
               placeholder="ornek_kullanici" required autofocus autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label">E-posta</label>
        <input type="email" name="email" class="form-control"
               placeholder="ornek@mail.com" autocomplete="email">
        <div class="form-hint">İsteğe bağlı</div>
      </div>
      <div class="form-group">
        <label class="form-label">Şifre <span style="color:red;">*</span></label>
        <input type="password" name="sifre" class="form-control"
               placeholder="En az 6 karakter" required autocomplete="new-password">
      </div>
      <div class="form-group">
        <label class="form-label">Şifre Tekrar <span style="color:red;">*</span></label>
        <input type="password" name="sifre2" class="form-control"
               placeholder="Şifreyi tekrar girin" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn-submit">Kayıt Ol</button>
    </form>

    <p class="footer-link">
      Zaten hesabınız var mı? <a href="{{ url_for('login') }}">Giriş Yap</a>
    </p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
